server.port=${SERVER_PORT:8081}

# Database Configuration (PostgreSQL by default, environment overrideable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/support_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Fallback Console (if H2 driver enabled)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Provider Configuration (Environment Variables with sensible defaults)
ai.provider=${AI_PROVIDER:builtin-rag}
ai.api-key=${AI_API_KEY:demo-key}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.temperature=${AI_TEMPERATURE:0.3}
ai.max-tokens=${AI_MAX_TOKENS:500}
ai.fallback-enabled=${AI_FALLBACK_ENABLED:true}

# Logging
logging.level.com.support.ai=INFO
